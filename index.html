<title>My Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Palette: bleu marine bancaire, fond gris-bleu clair, vert/rouge/orange pour l'état. Layout: une colonne mobile, barre d'onglets en bas. */
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#0f1b2d; --muted:#64748b; --line:#e3e8f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --good:#15803d; --bad:#dc2626; --warn:#d97706;
  --hero:linear-gradient(135deg,#0b1f3a 0%,#173a73 100%); --hero-ink:#ffffff;
  --font-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1220; --card:#111b2e; --ink:#e6edf8; --muted:#8c9bb5; --line:#1f2d47;
    --accent:#5b8def; --accent-ink:#0a1220; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --hero:linear-gradient(135deg,#14264a 0%,#1f3f7a 100%); --hero-ink:#ffffff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1220; --card:#111b2e; --ink:#e6edf8; --muted:#8c9bb5; --line:#1f2d47;
  --accent:#5b8def; --accent-ink:#0a1220; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --hero:linear-gradient(135deg,#14264a 0%,#1f3f7a 100%); --hero-ink:#ffffff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(16px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
h1,h2{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:26px}
h2{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.bk{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.bk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center}.gear[aria-current=true]{color:var(--accent)}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
.month span{min-width:112px;text-align:center;font-weight:700;text-transform:capitalize}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.hero{background:var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:0 8px 24px rgba(11,31,58,.18)}
.hero .lbl{color:rgba(255,255,255,.72);font-size:13px;font-weight:600}
.hero .big{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;font-size:40px;line-height:1.1;margin:4px 0 14px}
.hero .mini{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 8px}
.hero .row{gap:8px}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.mini .lbl{font-size:13px;opacity:.8}
.mini .v{font-weight:700;font-size:15px;white-space:nowrap}
.mini .v small{font-size:11px;font-weight:600;opacity:.75}
.amt.sv{color:var(--accent)}
.lbl{color:var(--muted);font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--bg)}
.grow{flex:1;min-width:0}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--good)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--bad)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
.pill.over{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.empty{color:var(--muted);text-align:center;padding:18px 0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;width:100%;max-width:520px;gap:4px;align-items:center}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);padding:6px 1px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
.tabs button .ic{display:block;height:22px;line-height:0}
.dot svg,.chip svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs .add{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:28px;margin:-18px 4px 0;box-shadow:0 4px 14px rgba(0,0,0,.25);justify-content:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
.sheet h2{margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:13px;color:var(--muted);font-weight:700}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;gap:8px;margin-top:6px}
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-weight:700}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>

function ymOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n,sign){
  var dec=state.settings&&state.settings.cents===false?0:2;
  var v=Math.round(n*Math.pow(10,dec))/Math.pow(10,dec);
  var s=Math.abs(v).toLocaleString(LOC(),{minimumFractionDigits:0,maximumFractionDigits:dec});
  return (sign&&v>0?'+':v<0?'−':'')+s+' '+state.currency;
}
function moneyS(n){var s=money(n),c=' '+state.currency;return s.slice(-c.length)===c?s.slice(0,-c.length)+'<small>'+c+'</small>':s;}
function monthLabel(ym){var p=ym.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString(LOC(),{month:'long',year:'numeric'});}
function shiftMonth(ym,d){var p=ym.split('-');return ymOf(new Date(+p[0],+p[1]-1+d,1));}
function monthTx(ym){return state.tx.filter(function(t){return t.date.slice(0,7)===ym;});}
function sum(a,f){return a.reduce(function(s,x){return s+f(x);},0);}

/* ---------- Persistance ---------- */
function loadLocal(){try{var r=localStorage.getItem('mon-budget');if(r)return JSON.parse(r);}catch(e){}return null;}
function saveLocal(){try{localStorage.setItem('mon-budget',JSON.stringify(state));}catch(e){}}
function scheduleSave(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(store&&store.doc){store.doc.set({data:JSON.stringify(state),updated:Date.now()}).catch(function(){});}
  },600);
}
function adopt(d){
  if(!d)return;
  state.currency=d.currency||'MAD';state.tx=d.tx||[];state.budgets=d.budgets||{};state.goals=d.goals||[];state.rec=d.rec||[];state.totalPlan=d.totalPlan||{};
  state.settings=Object.assign({theme:'auto',cents:true,hints:'auto',lang:'en'},d.settings||{});
}
function applyTheme(){
  var r=document.documentElement,th=state.settings.theme;
  r.setAttribute('lang',lang());document.title=lang()==='fr'?'Mon Budget':'My Budget';
  if(th==='light'||th==='dark')r.setAttribute('data-theme',th);else r.removeAttribute('data-theme');
}
async function initStore(){
  var local=loadLocal();
  if(local)adopt(local);
  render();
  try{
    var db=await claude.use('db'); var user=await claude.use('user');
    if(!db||!user)return;
    var id=await user.id();
    var doc=db.collection('data/users/'+id).doc('budget');
    store={doc:doc};
    var snap=await doc.get();
    var val=snap&&(typeof snap.data==='function'?snap.data():snap.data);
    if(val&&val.data){adopt(JSON.parse(val.data));saveLocal();}
    else if(state.tx.length||state.goals.length||Object.keys(state.budgets).length){scheduleSave();}
    render();
  }catch(e){}
}

function trText(s){
  if(lang()!=='en')return s;
  var m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return s;
  if(Object.prototype.hasOwnProperty.call(EN,core))return m[1]+EN[core]+m[3];
  for(var i=0;i<PAT.length;i++){if(PAT[i][0].test(core))return m[1]+core.replace(PAT[i][0],PAT[i][1])+m[3];}
  return s;
}
function trTree(root){
  if(lang()!=='en'||!root)return;
  if(root.nodeType===3){var v=trText(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return;}
  if(root.nodeType!==1)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode()))if(!(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)))list.push(n);
  list.forEach(function(x){var v=trText(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v;});
  var els=root.querySelectorAll?root.querySelectorAll('[placeholder],[aria-label],[title]'):[];
  var all=[root].concat([].slice.call(els));
  all.forEach(function(e){['placeholder','aria-label','title'].forEach(function(a){if(e.getAttribute&&e.hasAttribute(a)){var v=trText(e.getAttribute(a));if(v!==e.getAttribute(a))e.setAttribute(a,v);}});});
}
new MutationObserver(function(recs){recs.forEach(function(r){[].forEach.call(r.addedNodes,trTree);});}).observe(document.body,{childList:true,subtree:true});

function donut(data,total){
  var r=44,C=2*Math.PI*r,off=0,segs='';
  data.forEach(function(d){
    var len=C*d.v/total;
    segs+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+d.c+'" stroke-width="18" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"></circle>';
    off+=len;
  });
  return '<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Répartition des dépenses"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="18"></circle>'+segs+'</svg>';
}
function trend(){
  var months=[];for(var i=5;i>=0;i--)months.push(shiftMonth(ui.ym,-i));
  var vals=months.map(function(m){var t=monthTx(m);return {m:m,inc:sum(t.filter(function(x){return x.type==='in'}),function(x){return x.amount}),out:sum(t.filter(function(x){return x.type==='out'}),function(x){return x.amount})};});
  var max=Math.max.apply(null,vals.map(function(v){return Math.max(v.inc,v.out)}).concat([1]));
  var W=300,H=110,bw=14,gap=(W-6*bw*2)/7,out='';
  vals.forEach(function(v,i){
    var x=gap+i*(bw*2+gap),hi=v.inc/max*H,ho=v.out/max*H;
    out+='<rect x="'+x+'" y="'+(H-hi)+'" width="'+bw+'" height="'+hi+'" rx="3" fill="var(--good)"></rect>';
    out+='<rect x="'+(x+bw)+'" y="'+(H-ho)+'" width="'+bw+'" height="'+ho+'" rx="3" fill="var(--bad)"></rect>';
    out+='<text x="'+(x+bw)+'" y="'+(H+16)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+new Date(+v.m.slice(0,4),+v.m.slice(5)-1,1).toLocaleDateString(LOC(),{month:'short'}).replace('.','')+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+(H+22)+'" width="100%" role="img" aria-label="Revenus et dépenses sur six mois"><line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--line)"></line>'+out+'</svg>'+
   '<div class="legend" style="flex-direction:row;gap:16px;justify-content:center"><div><span class="sw" style="background:var(--good)"></span>Revenus</div><div><span class="sw" style="background:var(--bad)"></span>Dépenses</div></div>';
}
function genRec(){
  var ch=false,cur=ymOf(new Date()),td=new Date().getDate();
  (state.rec||[]).forEach(function(r){
    var y=r.lastYm;
    while(true){
      var nx=shiftMonth(y,1);if(nx>cur)break;if(nx===cur&&r.day>td)break;
      var p=nx.split('-'),dim=new Date(+p[0],+p[1],0).getDate(),dd=Math.min(r.day,dim);
      state.tx.push({id:uid(),type:r.type,cat:r.cat,amount:r.amount,note:r.note,date:nx+'-'+('0'+dd).slice(-2),rec:r.id});
      y=nx;ch=true;
    }
    r.lastYm=y;
  });
  if(ch)scheduleSave();
}
function copyText(txt){
  var ok=false;
  try{
    var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand&&document.execCommand('copy');document.body.removeChild(ta);
  }catch(e){}
  try{if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){});ok=true;}}catch(e){}
  return ok;
}
function markBackup(){state.settings.lastBackup=todayStr();scheduleSave();}
function backupDue(){
  if(!state.tx.length&&!state.goals.length)return false;
  var lb=state.settings.lastBackup;if(!lb)return true;
  return (new Date(todayStr()+'T12:00:00')-new Date(lb+'T12:00:00'))/864e5>=14;
}
function backupCard(){

function dueCard(){
  var nx=shiftMonth(ymOf(new Date()),1),a=[];
  state.goals.forEach(function(g){var v=g.plan&&g.plan[nx];if(v>0)a.push({g:g,v:v});});

  return '<div class="card"><div style="font-weight:700">'+(fr?'Le mois prochain (':'Next month (')+monthLabel(nx)+')</div>'+a.map(function(x){return '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><span class="t">'+(x.g.kind==='loan'?(fr?'Rembourser ':'Repay '):(fr?'Verser sur ':'Add to '))+esc(x.g.name)+'</span><span class="num" style="font-weight:700">+'+money(x.v)+'</span></div>'}).join('')+'<button class="link" data-tab="'+(a.some(function(x){return x.g.kind!=='loan'})?'goals':'loans')+'" style="margin-top:10px">'+(fr?'Voir':'View')+'</button></div>';
}
function simulate(g,extra){
  var ym=ymOf(new Date()),bal=g.saved;
  if(bal>=g.target)return 'now';
  for(var i=0;i<600;i++){ym=shiftMonth(ym,1);bal+=((g.plan&&g.plan[ym])||0)+extra;if(bal>=g.target)return ym;}

   '<div class="f"><label for="ip">'+(fr?'ou colle le contenu ici':'or paste the content here')+'</label><textarea id="ip" rows="6" style="font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%"></textarea></div>'+
   '<div class="lbl" style="margin-bottom:8px">'+(fr?'CSV : une ligne par mois, « mois;objectif;montant » (ex. 2027-01;Voyage;500). Objectif « Total » = total par mois.':'CSV: one line per month, “month;goal;amount” (e.g. 2027-01;Trip;500). Goal “Total” = total per month.')+'</div>'+
   '<div class="lbl" id="iperr" style="color:var(--bad);min-height:18px"></div>'+
   '<div class="btns"><button class="btn ghost" data-close="1" type="button">'+(fr?'Annuler':'Cancel')+'</button><button class="btn" id="ipg" type="button">'+(fr?'Importer':'Import')+'</button></div><div class="lbl" style="margin-top:8px">'+(fr?'Seuls les plans sont mis à jour. Tes versements réels ne changent pas.':'Only plans are updated. Your actual payments are not changed.')+'</div>');
  var fi=modal.querySelector('#ipf');
  fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){modal.querySelector('#ip').value=r.result;};r.readAsText(f);};
  function findGoal(id,name){return state.goals.filter(function(x){return x.id===id||(x.name||'').toLowerCase()===(name||'').toLowerCase()})[0];}
  modal.querySelector('#ipg').onclick=function(){
    var txt=modal.querySelector('#ip').value.trim(),err=modal.querySelector('#iperr');
    try{
      if(!txt)throw new Error('x');
      if(txt.charAt(0)==='{'){
        var d=JSON.parse(txt);if(!d||!Array.isArray(d.goals))throw new Error('x');
        if(d.totalPlan&&typeof d.totalPlan==='object')state.totalPlan=d.totalPlan;
        d.goals.forEach(function(ig){var g=findGoal(ig.id,ig.name);if(g){g.plan=ig.plan||{};if(ig.kind&&!g.kind)g.kind=ig.kind;}else state.goals.push(ig);});
      }else{
        var o=parsePlanCsv(txt);if(!o.n)throw new Error('x');
        Object.keys(o.total).forEach(function(k){state.totalPlan[k]=o.total[k];});
        Object.keys(o.goals).forEach(function(nm){var g=findGoal(null,nm);if(!g){g={id:uid(),name:nm,target:0,saved:0,note:''};state.goals.push(g);}g.plan=Object.assign(g.plan||{},o.goals[nm]);});
      }
      scheduleSave();closeSheet();render();
    }catch(e){err.textContent=fr?'Fichier non reconnu.':'File not recognized.';}
  };
}
function viewGoals(L){
  if(ui.mode==='plan')return viewPlan(L);
  var h='<div class="stack">'+(L?'':savingsControls());
  if(!state.goals.filter(function(g){return !!(g.kind==='loan')===!!L}).length)h+='<div class="card empty">'+(L?'Aucun emprunt.':(hintsOn()?'Crée un objectif : voyage, fonds d’urgence, achat…':'Aucun objectif.'))+'</div>';
  var totalNeed=0;
  if(state.goals.some(function(g){return g.kind==='loan'})){
    var sv=0,dt=0;state.goals.forEach(function(g){if(g.kind==='loan')dt+=g.saved;else sv+=g.saved;});
    var fr0=lang()==='fr';
    h+='<div class="card"><div class="lbl">'+(fr0?'Épargne nette (épargne + prêts)':'Net savings (savings + loans)')+'</div><div class="num" style="font-size:22px;font-weight:700">'+money(sv+dt)+'</div><div class="lbl num" style="margin-top:4px">'+(fr0?'Épargne ':'Savings ')+money(sv)+' · '+(fr0?'Prêts ':'Loans ')+money(dt)+'</div></div>';
  }
  state.goals.filter(function(g){return !!(g.kind==='loan')===!!L}).forEach(function(g){
    var pct=g.target?Math.min(1,g.saved/g.target):0,pl=goalPlan(g),line='';
    if(pl&&pl.per){totalNeed+=Math.ceil(pl.per);line='<div class="lbl num" style="margin-top:6px"><b>'+money(Math.ceil(pl.per))+' par mois</b> pendant '+pl.left+' mois pour finir en '+monthLabel(g.due)+'</div>';}
    else if(pl&&pl.late)line='<div class="lbl" style="margin-top:6px;color:var(--bad)">Échéance ('+monthLabel(g.due)+') dépassée, il reste '+money(pl.rem)+'</div>';
    var fr=lang()==='fr',loan=g.kind==='loan';
    if(g.plan){
      var ks=Object.keys(g.plan).sort(),nowYm=ymOf(new Date()),cur=g.plan[nowYm]||0,nxt=ks.filter(function(k){return k>nowYm})[0];
      var sg=function(v){return (v>0?'+':'')+money(v)};
      line+='<div class="lbl num" style="margin-top:6px">'+(fr?'Prévu ce mois : ':'Planned this month: ')+'<b>'+(cur?sg(cur):'—')+'</b>'+(nxt?' · '+(fr?'Prochain : ':'Next: ')+monthLabel(nxt)+' <b>'+sg(g.plan[nxt])+'</b>':'')+'</div>';
      line+='<div class="lbl num" style="margin-top:4px">'+(fr?'Plan à ce jour : ':'Plan to date: ')+money(planCum(g,nowYm))+' · '+(fr?'Réel : ':'Actual: ')+money(g.saved)+'</div>';
      if(cur>0){
        var paid=sum(monthTx(nowYm).filter(function(x){return x.type==='save'&&x.goal===g.id}),function(x){return x.amount}),gap=cur-paid;
        line+='<div class="lbl num" style="margin-top:4px">'+(fr?'Versé : ':'Paid: ')+'<b>'+money(paid)+'</b> · '+(gap>0?'<span style="color:var(--bad);font-weight:700">'+(fr?'Retard ':'Behind ')+money(gap)+'</span>':'<span style="color:var(--good);font-weight:700">'+(fr?'Objectif du mois atteint':'On track')+'</span>')+'</div>';
      }
    }
    if(loan)pct=0;
    h+='<div class="card" style="padding:0"><button style="text-align:left;color:inherit;width:100%;background:none;border:0;padding:16px;font:inherit" data-goal="'+g.id+'"><div style="display:flex;justify-content:space-between;gap:8px"><span class="t" style="font-weight:700">'+esc(g.name)+'</span>'+(loan?'<span class="pill">'+(fr?'Prêt':'Loan')+'</span>':'<span class="pill '+(pct>=1?'ok':'')+'">'+Math.round(pct*100)+'%</span>')+'</div>'+
     (loan?'':'<div class="bar"><i style="width:'+pct*100+'%"></i></div>')+'<div class="lbl num" style="margin-top:6px">'+(loan?'<span style="color:var(--bad);font-weight:700">'+money(g.saved)+'</span> · '+(fr?'prêt ':'loan ')+money(g.target):money(g.saved)+' / '+money(g.target)+(g.target>g.saved?' · reste '+money(g.target-g.saved):''))+'</div>'+line+(g.note?'<div class="lbl" style="margin-top:6px">'+esc(g.note)+'</div>':'')+'</button><div style="padding:0 16px 16px"><button class="btn" data-pay="'+g.id+'">'+(loan?(fr?'Rembourser / emprunter':'Repay / borrow'):'Verser sur cet objectif')+'</button></div></div>';
  });
  h+='<button class="btn" data-act="'+(L?'newloan':'newgoal')+'">'+(L?'Nouvel emprunt':'Nouvel objectif')+'</button><button class="btn ghost" data-act="importplan" type="button">'+(lang()==='fr'?'Importer le plan (fichier)':'Import plan (file)')+'</button>';
  return h+'</div>';
}

function openSheet(html){modal.innerHTML='<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';var i=modal.querySelector('input');if(i&&i.type!=='date'&&i.type!=='month')i.focus();}

function noteHint(type){return type==='in'?'Ex. Salaire, freelance…':'Ex. Marjane, loyer…';}
function txSheet(t){
  var edit=!!t;t=t||{type:'out',cat:'courses',date:todayStr(),amount:'',note:''};
  var type=t.type,sel=t.cat;
  function chips(){var list=type==='out'?CATS:INCOME_CATS;if(!list.some(function(c){return c.id===sel}))sel=list[0].id;return list.map(function(c){return '<button type="button" class="chip" data-pick="'+c.id+'" aria-pressed="'+(sel===c.id)+'">'+ico(c.e,16)+' '+cn(c)+'</button>'}).join('');}
  openSheet('<h2>'+(edit?'Modifier':'Nouvelle transaction')+'</h2>'+
   '<div class="seg" id="seg"><button type="button" data-type="out" aria-pressed="'+(type==='out')+'">Dépense</button><button type="button" data-type="in" aria-pressed="'+(type==='in')+'">Revenu</button></div>'+
   '<div class="f"><label for="a">Montant ('+state.currency+')</label><input id="a" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(t.amount)+'" placeholder="0"></div>'+
   '<div class="f"><label>Catégorie</label><div class="chips" id="chips">'+chips()+'</div></div>'+
   '<div class="f"><label for="n">Note</label><input id="n" type="text" value="'+esc(t.note||'')+'" placeholder="'+noteHint(type)+'"></div>'+
   '<div class="f"><label for="d">Date</label><input id="d" type="date" value="'+t.date+'"></div>'+
   (edit?'':'<label style="display:flex;align-items:center;gap:10px;margin:0 0 14px"><input id="rp" type="checkbox" style="width:22px;height:22px;padding:0;flex:none"><span>'+(lang()==='fr'?'Répéter chaque mois':'Repeat every month')+'</span></label>')+
   '<div class="btns"><button class="btn ghost" data-close="1" type="button">Annuler</button><button class="btn" id="ok" type="button">Enregistrer</button></div>'+
   (edit?'<div class="btns"><button class="btn danger" id="del" type="button">Supprimer</button></div>':''));
  var sheet=modal.querySelector('.sheet');
  sheet.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.type){type=b.dataset.type;sheet.querySelectorAll('#seg button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.type===type)});sheet.querySelector('#chips').innerHTML=chips();sheet.querySelector('#n').setAttribute('placeholder',trText(noteHint(type)));}
    else if(b.dataset.pick){sel=b.dataset.pick;sheet.querySelectorAll('#chips button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.pick===sel)});}
    else if(b.id==='ok'){
      var amt=parseFloat(sheet.querySelector('#a').value.replace(',','.'));
      if(!(amt>0)){sheet.querySelector('#a').focus();return;}
      var rec={id:edit?t.id:uid(),type:type,cat:sel,amount:amt,note:sheet.querySelector('#n').value.trim(),date:sheet.querySelector('#d').value||todayStr()};
      var rp=sheet.querySelector('#rp');
      if(!edit&&rp&&rp.checked){var rid=uid();rec.rec=rid;state.rec.push({id:rid,type:rec.type,cat:rec.cat,amount:rec.amount,note:rec.note,day:+rec.date.slice(8,10),lastYm:rec.date.slice(0,7)});}
      var before=rec.type==='out'?overBudgets(rec.date.slice(0,7)).map(function(x){return x.c.id}):[];
      if(edit)state.tx=state.tx.map(function(x){return x.id===rec.id?rec:x});else state.tx.push(rec);
      ui.ym=rec.date.slice(0,7);scheduleSave();closeSheet();render();
      if(rec.type==='out'){var nw=overBudgets(ui.ym).filter(function(x){return before.indexOf(x.c.id)<0});
        if(nw.length){var fr=lang()==='fr';openSheet('<h2 style="color:var(--bad)">'+(fr?'Alarme : plafond dépassé':'Alert: budget limit exceeded')+'</h2>'+nw.map(function(x){return '<div class="lbl" style="font-size:15px;margin-bottom:8px"><b>'+cn(x.c)+'</b> : '+money(x.sp)+' / '+money(x.lim)+' (+'+money(x.sp-x.lim)+')</div>'}).join('')+'<div class="btns"><button class="btn" data-close="1" type="button">OK</button></div>');}}
    }
    else if(b.id==='del'){state.tx=state.tx.filter(function(x){return x.id!==t.id});scheduleSave();closeSheet();render();}
  });
}

  var rem=Math.max(0,g.target-g.saved);
  openSheet('<h2>Verser sur « '+esc(g.name)+' »</h2><div class="lbl" style="margin-bottom:12px">'+(hintsOn()?'Le montant sort de ton solde du mois et s’ajoute à l’objectif. ':'')+'Reste à épargner : '+money(rem)+'.</div>'+
   '<div class="seg" role="group" id="sgn"><button type="button" data-sg="1" aria-pressed="true">'+(g.kind==='loan'?'Rembourser (+)':'Verser (+)')+'</button><button type="button" data-sg="-1" aria-pressed="false">'+(g.kind==='loan'?'Emprunter (−)':'Retirer (−)')+'</button></div>'+
   '<div class="f"><label for="va">Montant ('+state.currency+')</label><input id="va" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>'+
   '<div class="f"><label for="vd">Date</label><input id="vd" type="date" value="'+todayStr()+'"></div>'+
   '<div class="btns"><button class="btn ghost" data-close="1" type="button">Annuler</button><button class="btn" id="ok" type="button">Verser</button></div>');
  var sgn=1;
  modal.querySelector('#sgn').addEventListener('click',function(e){var b=e.target.closest('[data-sg]');if(!b)return;sgn=+b.dataset.sg;[].forEach.call(modal.querySelectorAll('#sgn button'),function(x){x.setAttribute('aria-pressed',x===b)});});
  modal.querySelector('#ok').onclick=function(){
    var amt=parseFloat(modal.querySelector('#va').value.replace(',','.'));
    if(!(amt>0)){modal.querySelector('#va').focus();return;}
    amt*=sgn;
    var d=modal.querySelector('#vd').value||todayStr();
    g.saved+=amt;
    state.tx.push({id:uid(),type:'save',cat:'epargne',goal:g.id,amount:amt,note:g.name,date:d});
    ui.ym=d.slice(0,7);scheduleSave();closeSheet();render();
  };
}
function saveEditSheet(t){
  var g=state.goals.filter(function(x){return x.id===t.goal})[0];
  openSheet('<h2>Versement</h2><div class="lbl" style="margin-bottom:14px;font-size:15px">'+money(t.amount)+' vers « '+esc(t.note||'Épargne')+' » le '+new Date(t.date+'T12:00:00').toLocaleDateString(LOC(),{day:'numeric',month:'long',year:'numeric'})+'.'+(g?'':' L’objectif n’existe plus.')+'</div>'+
   '<div class="btns"><button class="btn ghost" data-close="1" type="button">Fermer</button><button class="btn danger" id="del" type="button">Annuler ce versement</button></div>');
  modal.querySelector('#del').onclick=function(){
    if(g)g.saved-=t.amount;
    state.tx=state.tx.filter(function(x){return x.id!==t.id});scheduleSave();closeSheet();render();
  };
}
function resetSheet(){
  openSheet('<h2>Tout effacer ?</h2><div class="lbl" style="margin-bottom:14px;font-size:15px">Les transactions, budgets et objectifs seront supprimés de cet appareil. Pense à exporter avant.</div>'+
   '<div class="btns"><button class="btn ghost" data-close="1" type="button">Annuler</button><button class="btn danger" id="yes" type="button">Effacer</button></div>');
  modal.querySelector('#yes').onclick=function(){state.tx=[];state.budgets={};state.goals=[];state.rec=[];state.totalPlan={};scheduleSave();closeSheet();render();};
}

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tab],[data-act],[data-edit],[data-budget],[data-goal],[data-pay],[data-filter],[data-theme-set],[data-cents],[data-hints],[data-lang],[data-recdel],[data-mode],[data-planrow],[data-planedit],[data-close]');
  if(!el)return;
  if(el.dataset.close){if(el.classList.contains('sheet-bg')&&e.target!==el)return;closeSheet();return;}
  if(modal.firstChild&&!el.closest('.sheet-bg')&&!el.dataset.close){return;}
  if(el.dataset.tab){ui.tab=el.dataset.tab;render();window.scrollTo(0,0);}
  else if(el.dataset.act==='add')txSheet();
  else if(el.dataset.act==='prev'){ui.ym=shiftMonth(ui.ym,-1);render();}
  else if(el.dataset.act==='next'){ui.ym=shiftMonth(ui.ym,1);render();}
  else if(el.dataset.act==='newgoal')goalSheet();
  else if(el.dataset.act==='newloan')goalSheet(null,'loan');
  else if(el.dataset.act==='export')exportSheet();
  else if(el.dataset.act==='csv')csvSheet();
  else if(el.dataset.act==='importplan')importPlanSheet();
  else if(el.dataset.mode){ui.mode=el.dataset.mode;render();}
  else if(el.dataset.planedit)planSheet(el.dataset.planedit);
  else if(el.dataset.planrow){var pr=el.dataset.planrow.split('|');planSheet(pr[0],pr[1]);}
  else if(el.dataset.act==='backup'){var okc=copyText(JSON.stringify(state));if(okc){markBackup();render();var fr=lang()==='fr';openSheet('<h2>'+(fr?'Sauvegarde copiée':'Backup copied')+'</h2><div class="lbl" style="margin-bottom:14px;font-size:15px">'+(fr?'Colle-la maintenant dans Notes ou un e-mail à toi-même.':'Paste it now into Notes or an email to yourself.')+'</div><div class="btns"><button class="btn" data-close="1" type="button">OK</button></div>');}else exportSheet();}
  else if(el.dataset.recdel){state.rec=state.rec.filter(function(r){return r.id!==el.dataset.recdel});scheduleSave();render();}
  else if(el.dataset.act==='reset')resetSheet();
  else if(el.dataset.themeSet){state.settings.theme=el.dataset.themeSet;scheduleSave();render();}
  else if(el.dataset.lang){state.settings.lang=el.dataset.lang;scheduleSave();render();}
  else if(el.dataset.hints){state.settings.hints=el.dataset.hints;scheduleSave();render();}
  else if(el.dataset.cents!==undefined){state.settings.cents=el.dataset.cents==='1';scheduleSave();render();}
  else if(el.dataset.act==='import')importSheet();
  else if(el.dataset.pay)paySheet(el.dataset.pay);
  else if(el.dataset.edit){var t=state.tx.filter(function(x){return x.id===el.dataset.edit})[0];if(t){if(t.type==='save')saveEditSheet(t);else txSheet(t);}}
  else if(el.dataset.budget)budgetSheet(el.dataset.budget);
  else if(el.dataset.goal)goalSheet(el.dataset.goal);
  else if(el.dataset.filter){ui.filter=el.dataset.filter;render();}
});
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='q'){ui.q=e.target.value;var l=document.getElementById('txlist');if(l)l.innerHTML=txListHtml();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});

render();
initStore();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
})();
</script>
</body>
</html>
